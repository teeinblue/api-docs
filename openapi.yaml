            $ref: '#/components/schemas/LayerImageCategoryType'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/assetPerPage'
      responses:
        '200':
          description: Cursor-paginated list of layer image categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayerImageCategoryCursorPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
