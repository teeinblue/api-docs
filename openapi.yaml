  /layer-images:
    get:
      tags: [Layer Images]
      summary: List layer images
      description: |
        List your layer images, newest first.
        Requires **assets:read** ability.
      operationId: listLayerImages
      security:
        - bearerAuth: []
      x-required-ability: assets:read
      parameters:
        - $ref: '#/components/parameters/assetCategoryId'
        - $ref: '#/components/parameters/assetName'
        - $ref: '#/components/parameters/assetSearch'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/assetPerPage'
      responses:
        '200':
          description: Cursor-paginated list of layer images
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayerImageCursorPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    post:
      tags: [Layer Images]
      summary: Upload a layer image
      description: |
        Upload one layer image (see "Asset Libraries" for how to send each kind of file):
        - Raster images (PNG, JPEG, WebP, GIF, AVIF): `upload_id` from `POST /uploads`, or `url`.
          Processed in the background -- returns `status: processing`.
        - SVG/EPS and GPX: multipart `file`, or `url`.

        The file must match the category's type:
        - `clipart` / `vector` categories (or no category): raster images and SVG/EPS.
        - `gpx` categories: GPX route files. A GPX upload is rendered with your Mapbox access token
          (Settings > Maps), so it is rejected with `422` when no token is configured.

        Requires **assets:write** ability.
      operationId: createLayerImage
      security:
        - bearerAuth: []
      x-required-ability: assets:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/LayerImageUploadFields'
                - oneOf:
                    - $ref: '#/components/schemas/AssetUploadIdUpload'
                    - $ref: '#/components/schemas/AssetUrlUpload'
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/AssetFileUpload'
                - $ref: '#/components/schemas/LayerImageUploadFields'
              description: SVG/EPS and GPX files only. Raster images sent this way are rejected with `422` -- use `upload_id`.
      responses:
        '200':
          description: "`on_duplicate: skip` matched an existing layer image; it is returned unchanged."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayerImage'
        '201':
          description: Layer image created. Check `status` -- raster images start as `processing`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayerImage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /layer-images/{id}:
    get:
      tags: [Layer Images]
      summary: Get a layer image
      description: |
        Fetch one layer image. Poll this after an upload until `status` is `ready`.
        Requires **assets:read** ability.
      operationId: getLayerImage
      security:
        - bearerAuth: []
      x-required-ability: assets:read
      parameters:
        - $ref: '#/components/parameters/assetId'
      responses:
        '200':
          description: Layer image found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayerImage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Layer Images]
      summary: Delete a layer image
      description: |
        Delete a layer image. As in the portal, an image that is used in any artwork cannot be
        deleted (`400`).
        Requires **assets:write** ability.
      operationId: deleteLayerImage
      security:
        - bearerAuth: []
      x-required-ability: assets:write
      parameters:
        - $ref: '#/components/parameters/assetId'
      responses:
        '204':
          description: Layer image deleted
        '400':
          description: The image is used in an artwork
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                inUse:
                  value: { message: "This image has already been used." }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

