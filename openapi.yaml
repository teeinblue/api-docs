openapi: 3.1.0
info:
  title: Teeinblue Public API
  version: "1.0.0"
  description: |
    Public API for retrieving order data. Authenticated endpoints require a Bearer token
    that has the **orders:read** ability (as enforced by `ability:orders:read` middleware).
    Asset library endpoints require **assets:read** or **assets:write** (see "Asset Libraries").
    Replace server URLs with your real domains.

servers:
  - url: https://api.teeinblue.com/openapi/v1
    description: Production

tags:
  - name: Health
    description: Service status and version
  - name: Rate Limiting
    description: |
      Every endpoint under `/openapi/v1` shares a single limit: **60 requests per minute**.

      The limit is keyed to your account, not to the individual token -- if you use more than
      one API token (e.g. one per script or environment), they all draw from the same 60/minute
      budget, not 60 each.

      **Response headers.** Every response includes:

      | Header | Meaning |
      |---|---|
      | `X-RateLimit-Limit` | The limit for the current window (`60`) |
      | `X-RateLimit-Remaining` | Requests left in the current window |

      A response that hits the limit returns `429 Too Many Requests` with two more headers:

      | Header | Meaning |
      |---|---|
      | `Retry-After` | Seconds to wait before your next request |
      | `X-RateLimit-Reset` | Unix timestamp when the window resets |

      ```json
      {
        "message": "Too Many Attempts."
      }
      ```

      Back off until `Retry-After` has elapsed rather than retrying immediately -- retrying
      before the window resets only spends more of a budget that is already at zero.
  - name: Orders
    description: Read-only access to orders
  - name: Campaigns
    description: Read-only access to campaigns
  - name: Customizations
    description: Read-only access to customizations
  - name: Products
    description: Read-only access to products

  - name: Asset Libraries
    description: |
      Upload and look up the reusable images and fonts in your Teeinblue libraries -- the same
      libraries you manage in the portal. Use these endpoints to push material from your own
      storage instead of uploading it by hand or through an AI agent.

      | Library | Used in | Category type |
      |---|---|---|
      | Layer images | Image layers in artworks | `clipart`, `vector`, `gpx` |
      | Cliparts | Clipart and vector pickers in artworks | `clipart`, `vector` |
      | Mockup layers | Layers in mockups | -- |
      | Custom fonts | Text layers in artworks | none (fonts have no categories) |

      **Abilities.** Read endpoints need **assets:read**; create and delete endpoints need **assets:write**.

      **Sending a file.** How you send a file depends on its kind -- the same way the portal does:

      | File | Send it as |
      |---|---|
      | Raster image (PNG, JPEG, WebP, ...) -- layer images, cliparts, mockup layers | a pre-signed upload (`upload_id`), or a `url` |
      | SVG / EPS -- layer images, cliparts | `multipart/form-data` with a `file` field, or a `url` |
      | GPX -- layer images | `multipart/form-data` with a `file` field, or a `url` |
      | Font (TTF / OTF) -- custom fonts | `multipart/form-data` with a `file` field, or a `url` |

      *Pre-signed upload (raster images).* The image bytes go straight to storage, not through this API:
      1. `POST /uploads` with the file's `filename` and `filesize` (bytes). You get back an
         `upload_id`, an `upload_url` and the `upload_headers` to send with it.
      2. `PUT` the file bytes to `upload_url` with those headers before `expires_at`
         (a few minutes). The body must be exactly `filesize` bytes.
      3. Call the create endpoint (e.g. `POST /layer-images`) with `{"upload_id": "..."}`.
         Each `upload_id` can be used once.

      ```bash
      # 1. Request a presigned upload
      curl -X POST https://api.teeinblue.com/openapi/v1/uploads \
        -H "Authorization: Bearer $TOKEN" \
        -H "Content-Type: application/json" \
        -d '{"filename": "SKU123_BG.png", "filesize": 8388608}'
      # => { "upload_id": "...", "upload_url": "https://...",
      #      "upload_headers": {"Content-Type": "image/png", "Content-Length": "8388608"},
      #      "expires_at": "..." }

      # 2. PUT the bytes straight to storage. No Authorization header here -- and the
      #    headers must match upload_headers exactly, or the signature is rejected.
      curl -X PUT "$UPLOAD_URL" \
        -H "Content-Type: image/png" \
        -H "Content-Length: 8388608" \
        --data-binary @SKU123_BG.png

      # 3. Create the item
      curl -X POST https://api.teeinblue.com/openapi/v1/layer-images \
        -H "Authorization: Bearer $TOKEN" \
        -H "Content-Type: application/json" \
        -d '{"upload_id": "..."}'
      ```

      *URL.* Send `application/json` with a `url` that Teeinblue downloads. The URL must be
      publicly reachable (a signed cloud-storage URL works).

      Each file may be **at most 20 MB**, whichever way it is sent. Larger files are rejected with `422`.

      **Processing.** Raster images are processed in the background: the create call returns
      `201` with `status: processing`, and `url` / `thumbnail_url` are `null` until processing
      finishes. Poll the item's `GET` endpoint until `status` is `ready`.
      SVG/EPS files, GPX files and fonts are processed during the request and come back `ready`.

      **Duplicates.** By default every upload creates a new item, as in the portal. Pass
      `on_duplicate` to make a re-run of your upload script safe:
      - `create` (default) -- always create a new item.
      - `skip` -- if an item with the same `name` already exists in the same category, return it
        (`200`) without uploading.
      - `replace` -- **cliparts only**: replace the image of the existing clipart with the same
        `name` in the same category, keeping its id (the portal's "Replace items").

      **Using an item in an artwork.** `url` is a storage key such as
      `users/4965/image-layers/68c0006568e69_large.webp`. Put it in a layer exactly as returned --
      do not prefix it with a domain. `thumbnail_url` is a full URL meant only for previews.

      **Limits.** Uploads count towards the same daily limits as uploads made in the portal.
      When a limit is reached the API returns `429` (see "TooManyRequests" below for the two
      kinds of limit that can trigger it). These daily limits are separate from the
      account-wide per-minute request limit described in "Rate Limiting".
  - name: Layer Images
    description: Images used by image layers in artworks, grouped in layer image categories.
  - name: Cliparts
    description: Cliparts and vectors used by clipart pickers in artworks, grouped in clipart categories.
  - name: Mockup Layers
    description: Images used as layers in mockups, grouped in mockup layer categories.
  - name: Custom Fonts
    description: Fonts you upload for use in text layers.
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                ok:
                  value: { status: ok }

  /version:
    get:
      tags: [Health]
      summary: API version
      operationId: getVersion
      responses:
        '200':
          description: Current API version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
              examples:
                v1:
                  value: { version: "1.0.0" }

  /orders:
    get:
      tags: [Orders]
      summary: List orders
      description: |
        Returns a cursor-paginated list of orders visible to the authenticated user.
        This endpoint requires a token with the **orders:read** ability.
      operationId: listOrders
      security:
        - bearerAuth: []
      x-required-ability: orders:read
      parameters:
        - $ref: '#/components/parameters/s'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/sort_type'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/start_date'
        - $ref: '#/components/parameters/end_date'
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/tib_status'
        - $ref: '#/components/parameters/fulfillment_status'
        - $ref: '#/components/parameters/financial_status'
        - $ref: '#/components/parameters/test'
        - $ref: '#/components/parameters/by_teeinblue'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/platform'
      responses:
        '200':
          description: List of orders (cursor-paginated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCursorPage'
              example:
                data:
                  - id: 12345
                    order_name: "#1001"
                    platform_order_id: "4567890123"
                    test_order: false
                    total_price: 29.99
                    currency: "USD"
                    fulfillment_status: "fulfilled"
                    financial_status: "paid"
                    status: "customized"
                    tib_status: "12"
                    shipping_method: "Standard Shipping"
                    instance_name: "My Awesome T-Shirt Store"
                    platform_domain: "my-shop.myshopify.com"
                    created_at: "2025-01-15T10:30:00Z"
                    deleted_at: null
                    address:
                      first_name: "John"
                      last_name: "Smith"
                      name: "John Smith"
                      company: null
                      phone: "+1-555-123-4567"
                      address1: "123 Main Street"
                      address2: "Apt 4B"
                      city: "New York"
                      province: "New York"
                      province_code: "NY"
                      country: "United States"
                      country_code: "US"
                      zip: "10001"
                    customer:
                      id: 12345
                      platform_linked_id: "shopify_customer_987654321"
                      first_name: "Jane"
                      last_name: "Doe"
                      email: "jane.doe@example.com"
                      phone: "+1-555-987-6543"
                      created_at: "2024-12-01T09:15:00Z"
                links:
                  next: "https://api.teeinblue.com/openapi/v1/orders?cursor=eyJjcmVhdGVkX2F0IjoiMjAyNS0wMS0xNSIsImlkIjoxMjM0NX0&per_page=25"
                  prev: null
                meta:
                  per_page: 25
                  next_cursor: "eyJjcmVhdGVkX2F0IjoiMjAyNS0wMS0xNSIsImlkIjoxMjM0NX0"
                  prev_cursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: Get order by ID
      description: |
        Fetch a single order by **internal order ID** or **platform-specific ID**.
        Requires **orders:read** ability.
      operationId: getOrder
      security:
        - bearerAuth: []
      x-required-ability: orders:read
      parameters:
        - name: orderId
          in: path
          required: true
          description: Platform-linked ID (e.g., `1234567890`) or Teeinblue order ID (e.g., `12345`), platform-linked ID takes precedence.
          schema:
            type: string
        - $ref: '#/components/parameters/includeCustomization'
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value: { message: "Order not found" }

  /orders/etsy:
    get:
      tags: [Orders]
      summary: List Etsy orders
      description: |
        Convenience wrapper for **/orders** that implicitly filters `platform=etsy`.
        Requires **orders:read** ability.
      operationId: listEtsyOrders
      security:
        - bearerAuth: []
      x-required-ability: orders:read
      parameters:
        - $ref: '#/components/parameters/s'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/sort_type'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/start_date'
        - $ref: '#/components/parameters/end_date'
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/tib_status'
        - $ref: '#/components/parameters/fulfillment_status'
        - $ref: '#/components/parameters/financial_status'
        - $ref: '#/components/parameters/test'
        - $ref: '#/components/parameters/by_teeinblue'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: List of Etsy orders (cursor-paginated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCursorPage'
              example:
                data:
                  - id: 12345
                    order_name: "#1001"
                    platform_order_id: "4567890123"
                    test_order: false
                    total_price: 29.99
                    currency: "USD"
                    fulfillment_status: "fulfilled"
                    financial_status: "paid"
                    status: "customized"
                    tib_status: "12"
                    shipping_method: "Standard Shipping"
                    instance_name: "My Awesome T-Shirt Store"
                    platform_domain: "my-shop.etsy.com"
                    created_at: "2025-01-15T10:30:00Z"
                    deleted_at: null
                    address:
                      first_name: "John"
                      last_name: "Smith"
                      name: "John Smith"
                      company: null
                      phone: "+1-555-123-4567"
                      address1: "123 Main Street"
                      address2: "Apt 4B"
                      city: "New York"
                      province: "New York"
                      province_code: "NY"
                      country: "United States"
                      country_code: "US"
                      zip: "10001"
                    customer:
                      id: 12345
                      platform_linked_id: "etsy_user_987654321"
                      first_name: "Jane"
                      last_name: "Doe"
                      email: "jane.doe@example.com"
                      phone: "+1-555-987-6543"
                      created_at: "2024-12-01T09:15:00Z"
                links:
                  next: "https://api.teeinblue.com/openapi/v1/orders/etsy?cursor=eyJjcmVhdGVkX2F0IjoiMjAyNS0wMS0xNSIsImlkIjoxMjM0NX0&per_page=25"
                  prev: null
                meta:
                  per_page: 25
                  next_cursor: "eyJjcmVhdGVkX2F0IjoiMjAyNS0wMS0xNSIsImlkIjoxMjM0NX0"
                  prev_cursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /orders/etsy/{etsyId}:
    get:
      tags: [Orders]
      summary: Get Etsy order by order ID
      description: |
        Fetch a single Etsy order by its Etsy order ID.
        Requires **orders:read** ability.
      operationId: getEtsyOrder
      security:
        - bearerAuth: []
      x-required-ability: orders:read
      parameters:
        - name: etsyId
          in: path
          required: true
          schema:
            type: string
          description: Etsy order ID (e.g., `1234567890`) or Teeinblue order ID (e.g., `12345`), Etsy order ID takes precedence.
        - $ref: '#/components/parameters/includeCustomization'
      responses:
        '200':
          description: Etsy order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Etsy order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value: { message: "Etsy order not found" }
    patch:
      tags: [Orders]
      summary: Update Etsy order
      description: |
        Update a single Etsy order by its Etsy order ID.
        Requires **orders:write** ability.
      operationId: updateEtsyOrder
      security:
        - bearerAuth: []
      x-required-ability: orders:write
      parameters:
        - name: etsyId
          in: path
          required: true
          schema:
            type: string
          description: Etsy order ID (e.g., `1234567890`) or Teeinblue order ID (e.g., `12345`), Etsy order ID takes precedence.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEtsyOrderRequest"
      responses:
        '200':
          description: Etsy order updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Etsy order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /orders/etsy/batch-update:
    patch:
      tags: [Orders]
      summary: Batch update Etsy orders
      description: |
        Batch update Etsy orders by their Etsy order IDs.
        Requires **orders:write** ability.
      operationId: batchUpdateEtsyOrders
      security:
        - bearerAuth: []
      x-required-ability: orders:write
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/BatchUpdateEtsyOrderRequestItem"
      responses:
        "200":
          description: Etsy orders updated
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BatchUpdateEtsyOrderResponseItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /stores/{platformDomain}/orders:
    get:
      tags: [Orders]
      summary: List orders for specific store
      description: |
        Returns orders for a specific store identified by platform domain.
        Requires **orders:read** ability.
      operationId: listStoreOrders
      security:
        - bearerAuth: []
      x-required-ability: orders:read
      parameters:
        - name: platformDomain
          in: path
          required: true
          description: Store platform domain (e.g., my-shop.myshopify.com)
          schema:
            type: string
        - $ref: '#/components/parameters/s'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/sort_type'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/start_date'
        - $ref: '#/components/parameters/end_date'
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/tib_status'
        - $ref: '#/components/parameters/fulfillment_status'
        - $ref: '#/components/parameters/financial_status'
        - $ref: '#/components/parameters/test'
        - $ref: '#/components/parameters/by_teeinblue'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: List of store orders (cursor-paginated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCursorPage'
              example:
                data:
                  - id: 12345
                    order_name: "#1001"
                    platform_order_id: "4567890123"
                    test_order: false
                    total_price: 29.99
                    currency: "USD"
                    fulfillment_status: "fulfilled"
                    financial_status: "paid"
                    status: "customized"
                    tib_status: "12"
                    shipping_method: "Standard Shipping"
                    instance_name: "My Awesome T-Shirt Store"
                    platform_domain: "my-shop.myshopify.com"
                    created_at: "2025-01-15T10:30:00Z"
                    deleted_at: null
                    address:
                      first_name: "John"
                      last_name: "Smith"
                      name: "John Smith"
                      company: null
                      phone: "+1-555-123-4567"
                      address1: "123 Main Street"
                      address2: "Apt 4B"
                      city: "New York"
                      province: "New York"
                      province_code: "NY"
                      country: "United States"
                      country_code: "US"
                      zip: "10001"
                    customer:
                      id: 12345
                      platform_linked_id: "shopify_customer_987654321"
                      first_name: "Jane"
                      last_name: "Doe"
                      email: "jane.doe@example.com"
                      phone: "+1-555-987-6543"
                      created_at: "2024-12-01T09:15:00Z"
                links:
                  next: "https://api.teeinblue.com/openapi/v1/stores/my-shop.myshopify.com/orders?cursor=eyJjcmVhdGVkX2F0IjoiMjAyNS0wMS0xNSIsImlkIjoxMjM0NX0&per_page=25"
                  prev: null
                meta:
                  per_page: 25
                  next_cursor: "eyJjcmVhdGVkX2F0IjoiMjAyNS0wMS0xNSIsImlkIjoxMjM0NX0"
                  prev_cursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Store not found or access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value: { message: "Store not found or access denied" }

  /campaigns/{campaignId}:
    get:
      tags: [Campaigns]
      summary: Get campaign by UUID
      description: |
        Fetch a single campaign by **UUID** and **platformDomain**.
        Requires **campaigns:read** ability.
      operationId: getCampaign
      security:
        - bearerAuth: []
      x-required-ability: campaigns:read
      parameters:
        - name: UUID
          in: path
          required: true
          schema:
            type: string
          description: Campaign UUID (e.g., `6d823e4d-8f21-41f8-b461-e97c981880bc`)
        - $ref: '#/components/parameters/platformDomain'
      responses:
        '200':
          description: Campaign found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformCampaign'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value: { message: "Campaign not found" }

  /campaigns/product-base:
    get:
      tags: [Campaigns]
      summary: List product base campaigns
      description: |
        List all product base campaigns.
        Requires **campaigns:read** ability.
      operationId: listProductBaseCampaigns
      security:
        - bearerAuth: []
      x-required-ability: campaigns:read
      parameters:
        - $ref: '#/components/parameters/s'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/sort_type'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: List of product base campaigns (cursor-paginated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductBaseCampaignCursorPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /campaigns/product-base/{id}:
    get:
      tags: [Campaigns]
      summary: Get a product base campaign by ID
      description: |
        Fetch a single product base campaign by its ID.
        Requires **campaigns:read** ability.
      operationId: getProductBaseCampaignById
      security:
        - bearerAuth: []
      x-required-ability: campaigns:read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Product base campaign ID (e.g., `1245`)
      responses:
        '200':
          description: Product base campaign found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductBaseCampaign'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Product base campaign not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound:
                  value: { message: "Product base campaign not found" }

  /campaigns/platform-base:
    get:
      tags: [Campaigns]
      summary: List platform base campaigns
      description: |
        List all platform base campaigns.
        Requires **campaigns:read** ability.
      operationId: listPlatformBaseCampaigns
      security:
        - bearerAuth: []
      x-required-ability: campaigns:read
      parameters:
        - $ref: '#/components/parameters/s'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/sort_type'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/platforms'
      responses:
        '200':
          description: List of platform base campaigns (cursor-paginated)
          content:
            application/json:
              schema:
