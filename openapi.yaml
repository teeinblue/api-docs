  # ---------------------------------------------------------------------------
  # Asset libraries: pre-signed uploads
  # ---------------------------------------------------------------------------
  /uploads:
    post:
      tags: [Asset Libraries]
      summary: Create a pre-signed upload
      description: |
        Step 1 of uploading a raster image (see "Asset Libraries"). Returns an `upload_url` to
        `PUT` the image bytes to, and an `upload_id` to pass to `POST /layer-images`,
        `POST /cliparts` or `POST /mockup-layers` once the bytes are uploaded.

        Images larger than 128 megapixels are rejected when `filewidth` and `fileheight` are given.
        Requires **assets:write** ability.
      operationId: createUpload
      security:
        - bearerAuth: []
      x-required-ability: assets:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, filesize]
              properties:
                filename:
                  type: string
                  description: File name including its extension. Used as the item's default name.
                  example: "SKU123_BG.png"
                filesize:
                  type: integer
                  minimum: 1
                  maximum: 20971520
                  description: Size of the file in bytes, at most 20 MB. The uploaded body must be exactly this size.
                  example: 8388608
                filewidth:
                  type: integer
                  minimum: 1
                  description: Image width in pixels. Optional; used to reject images over 128 megapixels before uploading.
                  example: 4000
                fileheight:
                  type: integer
                  minimum: 1
                  description: Image height in pixels. Optional; used with `filewidth`.
                  example: 4000
      responses:
        '201':
          description: Upload created; `PUT` the file bytes to `upload_url` next.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUpload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ---------------------------------------------------------------------------
