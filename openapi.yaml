      operationId: listClipartCategories
      security:
        - bearerAuth: []
      x-required-ability: assets:read
      parameters:
        - $ref: '#/components/parameters/assetName'
        - $ref: '#/components/parameters/assetSearch'
        - name: type
          in: query
          description: Only return categories of this type.
          schema:
            $ref: '#/components/schemas/ClipartCategoryType'
        - name: parent_id
          in: query
          description: Only return direct sub-categories of this category. Use `0` for top-level categories.
          schema:
            type: integer
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/assetPerPage'
      responses:
        '200':
          description: Cursor-paginated list of clipart categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClipartCategoryCursorPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    post:
      tags: [Cliparts]
      summary: Create a clipart category
      description: |
        Create a clipart or vector category, optionally nested under one of your categories.
        The `type` cannot be changed later.
        Requires **assets:write** ability.
      operationId: createClipartCategory
      security:
        - bearerAuth: []
      x-required-ability: assets:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name:
                  type: string
                  maxLength: 255
                  example: "SKU123"
                type:
                  type: string
                  enum: [clipart, vector]
                description:
                  type: string
                  nullable: true
                parent_id:
                  type: integer
                  nullable: true
                  description: |
                    Nest the new category under this one. It must be one of your categories and
                    of the same type. Nesting is supported for `clipart` categories, up to 5 levels.
                on_duplicate:
                  $ref: '#/components/schemas/CategoryOnDuplicate'
      responses:
        '200':
          description: "`on_duplicate: skip` matched an existing category with the same parent, name and type; it is returned unchanged."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClipartCategory'
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClipartCategory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /clipart-categories/{id}:
    get:
      tags: [Cliparts]
      summary: Get a clipart category
      description: Requires **assets:read** ability.
      operationId: getClipartCategory
      security:
        - bearerAuth: []
      x-required-ability: assets:read
      parameters:
        - $ref: '#/components/parameters/assetId'
      responses:
        '200':
          description: Category found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClipartCategory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /cliparts:
    get:
      tags: [Cliparts]
      summary: List cliparts
      description: |
        List your cliparts, newest first.
        Requires **assets:read** ability.
      operationId: listCliparts
      security:
        - bearerAuth: []
      x-required-ability: assets:read
      parameters:
        - $ref: '#/components/parameters/assetCategoryId'
        - $ref: '#/components/parameters/assetName'
        - $ref: '#/components/parameters/assetSearch'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/assetPerPage'
      responses:
        '200':
          description: Cursor-paginated list of cliparts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClipartCursorPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    post:
      tags: [Cliparts]
      summary: Upload a clipart
      description: |
        Upload one clipart into a `clipart` or `vector` category (see "Asset Libraries" for how
        to send each kind of file):
        - Raster images (PNG, JPEG, WebP, GIF, AVIF, APNG): `upload_id` from `POST /uploads`, or `url`.
          Processed in the background -- returns `status: processing`.
        - SVG/EPS: multipart `file`, or `url`.

        Requires **assets:write** ability.
      operationId: createClipart
      security:
        - bearerAuth: []
      x-required-ability: assets:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ClipartUploadFields'
                - oneOf:
                    - $ref: '#/components/schemas/AssetUploadIdUpload'
                    - $ref: '#/components/schemas/AssetUrlUpload'
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/AssetFileUpload'
                - $ref: '#/components/schemas/ClipartUploadFields'
              description: SVG/EPS files only. Raster images sent this way are rejected with `422` -- use `upload_id`.
      responses:
        '200':
          description: |
            An existing clipart with the same name was matched:
            - `on_duplicate: skip` -- returned unchanged.
            - `on_duplicate: replace` -- its image is being replaced (`status: processing` for raster images).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clipart'
        '201':
          description: Clipart created. Check `status` -- raster images start as `processing`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clipart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /cliparts/{id}:
    get:
      tags: [Cliparts]
      summary: Get a clipart
      description: |
        Fetch one clipart. Poll this after an upload until `status` is `ready`.
        Requires **assets:read** ability.
      operationId: getClipart
      security:
        - bearerAuth: []
      x-required-ability: assets:read
      parameters:
        - $ref: '#/components/parameters/assetId'
      responses:
        '200':
          description: Clipart found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clipart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Cliparts]
      summary: Delete a clipart
      description: |
        Delete a clipart from its category. Artworks that use the category no longer offer it.
        Requires **assets:write** ability.
      operationId: deleteClipart
      security:
        - bearerAuth: []
      x-required-ability: assets:write
      parameters:
        - $ref: '#/components/parameters/assetId'
      responses:
        '204':
          description: Clipart deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /clipart-category-bulk-uploads:
    post:
      tags: [Cliparts]
      summary: Start a clipart bulk upload (zip)
      description: |
        Upload a whole folder of cliparts as one zip file. Folders in the zip become clipart
        categories and the images inside them become cliparts -- the same as the portal's
        bulk upload.

        Steps:
        1. Call this endpoint with the zip's `filename` and `filesize` (bytes). You get back an
           `upload_url` and the `upload_headers` to send with it.
        2. `PUT` the zip bytes to `upload_url` with those headers before `expires_at`.
           The body must be exactly `filesize` bytes.
        3. Call `POST /clipart-category-bulk-uploads/{id}/extract`.
        4. Poll `GET /clipart-category-bulk-uploads/{id}` until `status` is `done` or `error`.

        The zip size limit and the number of bulk uploads you can have in progress at once
        depend on your plan, as in the portal.
        Requires **assets:write** ability.
      operationId: createClipartCategoryBulkUpload
      security:
        - bearerAuth: []
      x-required-ability: assets:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, filesize]
              properties:
                filename:
                  type: string
                  description: Name of the zip file. Used as the top category's name when the zip has no single top folder.
                  example: "SKU123.zip"
                filesize:
                  type: integer
                  description: Size of the zip file in bytes.
                  example: 52428800
                parent_category_id:
                  type: integer
                  nullable: true
                  description: Create the categories under this clipart category. It must be one of your `clipart` categories.
                ignore_parent:
                  type: boolean
                  default: true
                  description: |
                    - `true`: skip the zip's top folder; each folder inside it becomes a category
                      directly under `parent_category_id` (or at the top level).
                    - `false`: keep the top folder as a category. If the zip has no single top
                      folder, the zip's file name is used as the top category.
      responses:
        '201':
          description: Bulk upload created; upload the zip to `upload_url` next.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClipartCategoryBulkUploadStart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: The zip is larger than your plan allows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /clipart-category-bulk-uploads/{id}:
    get:
      tags: [Cliparts]
      summary: Get a clipart bulk upload
      description: |
        Check the progress of a bulk upload. When `status` is `done`, `clipart_category_id`
        is the category the cliparts were created in.
        Requires **assets:read** ability.
      operationId: getClipartCategoryBulkUpload
      security:
        - bearerAuth: []
      x-required-ability: assets:read
      parameters:
        - $ref: '#/components/parameters/assetId'
      responses:
        '200':
          description: Bulk upload found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClipartCategoryBulkUpload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /clipart-category-bulk-uploads/{id}/extract:
    post:
      tags: [Cliparts]
      summary: Extract an uploaded zip
      description: |
        Start creating categories and cliparts from the uploaded zip. Call this once the `PUT`
        to `upload_url` has finished. Unextracted uploads are picked up automatically after
        15 minutes.
        Requires **assets:write** ability.
      operationId: extractClipartCategoryBulkUpload
      security:
        - bearerAuth: []
      x-required-ability: assets:write
      parameters:
        - $ref: '#/components/parameters/assetId'
      responses:
        '202':
          description: Extraction started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClipartCategoryBulkUpload'
        '400':
          description: The bulk upload has already been extracted or has failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidStatus:
                  value: { message: "Can not start extracting bulk upload with invalid status" }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The zip has not been uploaded to `upload_url` yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

