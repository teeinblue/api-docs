          description: Mockup layer found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MockupLayer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Mockup Layers]
      summary: Delete a mockup layer
