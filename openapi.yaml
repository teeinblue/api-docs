    post:
      tags: [Mockup Layers]
      summary: Upload a mockup layer
      description: |
        Upload one mockup layer image (PNG, JPEG, WebP, GIF, AVIF): `upload_id` from
        `POST /uploads`, or `url` (see "Asset Libraries"). It is processed in the background
        and returns `status: processing`.
        Requires **assets:write** ability.
      operationId: createMockupLayer
      security:
        - bearerAuth: []
      x-required-ability: assets:write
      requestBody:
